openapi: 3.1.0
info:
  title: Super magnet na klientov — Backend API
  description: |
    Lokálny, open-source Apollo.io klon pre slovenský B2B trh.
    LLM inference prebieha výhradne lokálne (llama.cpp / GGUF).

    Externé integrácie (Gmail, Google Sheets/Docs) bežia v **sandbox** režime,
    pokým nie sú nakonfigurované OAuth poverenia — endpointy sú vždy volateľné.
  version: 0.4.0
  license:
    name: MIT
servers:
  - url: http://localhost:8000
    description: Lokálny dev backend

tags:
  - name: system
  - name: llm
  - name: auth
  - name: leads
  - name: embeddings
  - name: email
  - name: sequences
  - name: export
  - name: workflows
  - name: transcription

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LLMPromptRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 16000 }
        model_hint: { type: string, enum: [7b, 3b], default: "7b" }
        top_k: { type: integer, minimum: 0, maximum: 100, default: 40 }
        max_tokens: { type: integer, minimum: 1, maximum: 4096, default: 256 }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0.7 }
        use_rag: { type: boolean, default: false }
    LLMPromptResponse:
      type: object
      required: [text, backend, model]
      properties:
        text: { type: string }
        backend: { type: string, enum: [llama_cpp, mock] }
        model: { type: string }
        model_hint: { type: string, nullable: true }
        tokens_used: { type: integer, nullable: true }
        finish_reason: { type: string, nullable: true }
        cached: { type: boolean, default: false }
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { type: string, default: "user" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      required: [access_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, default: "bearer" }
        role: { type: string, nullable: true }
    UserOut:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string }
    LeadCreate:
      type: object
      required: [company_name]
      properties:
        company_name: { type: string }
        ico: { type: string, nullable: true }
        contact_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        sector: { type: string, nullable: true }
        company_size: { type: string, nullable: true }
        source: { type: string, default: "manual" }
        notes: { type: string, nullable: true }
    LeadOut:
      type: object
      properties:
        id: { type: integer }
        company_name: { type: string }
        ico: { type: string, nullable: true }
        contact_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        sector: { type: string, nullable: true }
        company_size: { type: string, nullable: true }
        source: { type: string }
        score: { type: number, nullable: true }
        enriched: { type: integer }
        notes: { type: string, nullable: true }
    SendEmailRequest:
      type: object
      required: [to, subject, body]
      properties:
        to: { type: string }
        subject: { type: string }
        body: { type: string }
        lead_id: { type: integer, nullable: true }
    SequenceStep:
      type: object
      properties:
        delay_hours: { type: integer, default: 24 }
        subject: { type: string }
        body: { type: string }
    SequenceCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/SequenceStep" } }
    SequenceOut:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/SequenceStep" } }
    WorkflowCreate:
      type: object
      required: [name, definition]
      properties:
        name: { type: string }
        definition: { type: object, properties: { steps: { type: array, items: { type: object } } } }
    WorkflowOut:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        definition: { type: object }
    ExecuteRequest:
      type: object
      required: [workflow_id, lead_id]
      properties:
        workflow_id: { type: integer }
        lead_id: { type: integer }
    DeliverabilityRequest:
      type: object
      required: [domain]
      properties:
        domain: { type: string }
    InsightsRequest:
      type: object
      required: [transcript]
      properties:
        transcript: { type: string }
    EnrollRequest:
      type: object
      required: [lead_ids]
      properties:
        lead_ids: { type: array, items: { type: integer } }
    SheetsExportRequest:
      type: object
      required: [spreadsheet_id]
      properties:
        spreadsheet_id: { type: string }
        rows: { type: array, items: { type: array, items: { type: string } } }
        range: { type: string, default: "Sheet1" }
    DocsExportRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        content: { type: string, nullable: true }
    EmbedUpsert:
      type: object
      required: [doc_id, text]
      properties:
        doc_id: { type: string }
        text: { type: string }
        metadata: { type: object, additionalProperties: true }
    EmbedSearchResult:
      type: object
      properties:
        id: { type: string }
        metadata: { type: object }
        score: { type: number }
    ValidationError:
      type: object
      properties:
        detail: { type: string }
  responses:
    ValidationError:
      description: Chyba validácie
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    Unauthorized:
      description: Neautorizované
    NotFound:
      description: Nenájdené
    Conflict:
      description: Konflikt (napr. existujúci používateľ)

paths:
  /health:
    get:
      tags: [system]
      summary: Zdravotný stav služby
      responses:
        "200":
          description: Služba beží
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  llm_backend: { type: string, example: mock }
                  version: { type: string, example: "0.4.0" }

  /api/llm/prompt:
    post:
      tags: [llm]
      summary: Spusti lokálny LLM prompt (mock fallback ak model chýba)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LLMPromptRequest" }
      responses:
        "200":
          description: Vygenerovaná odpoveď
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMPromptResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/llm/status:
    get:
      tags: [llm]
      summary: Stav LLM Orchestratora
      responses:
        "200":
          description: Backend a načítaný model
          content:
            application/json:
              schema:
                type: object
                properties:
                  backend: { type: string, example: llama_cpp }
                  model: { type: string }
                  model_loaded: { type: boolean }

  /api/auth/register:
    post:
      tags: [auth]
      summary: Registrácia lokálneho účtu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Účet vytvorený
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserOut" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Login, vráti JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: JWT token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/leads:
    get:
      tags: [leads]
      summary: Zoznam leadov s filtrami a pagination
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: company_name, in: query, schema: { type: string } }
        - { name: sector, in: query, schema: { type: string } }
        - { name: min_score, in: query, schema: { type: number } }
        - { name: enriched, in: query, schema: { type: boolean } }
        - { name: skip, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Zoznam leadov
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LeadOut" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [leads]
      summary: Manuálne vytvorenie leadu (voliteľná ORSR enrichment)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadCreate" }
      responses:
        "201":
          description: Lead vytvorený
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/leads/import:
    post:
      tags: [leads]
      summary: Upload CSV, validácia, enrichment job
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Import zaradený
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  errors: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/leads/{lead_id}:
    get:
      tags: [leads]
      summary: Detail leadu
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lead_id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadOut" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [leads]
      summary: Úprava leadu
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lead_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadCreate" }
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadOut" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [leads]
      summary: Zmazanie leadu
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lead_id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Zmazané }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/leads/{lead_id}/score:
    post:
      tags: [leads]
      summary: LLM lead scoring (0-100)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lead_id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Skóre
          content:
            application/json:
              schema:
                type: object
                properties:
                  lead_id: { type: integer }
                  score: { type: number }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/embeddings/upsert:
    post:
      tags: [embeddings]
      summary: Upsert dokumentu do vektorového indexu
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedUpsert" }
      responses:
        "200":
          description: Uložené
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  doc_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/embeddings/search:
    get:
      tags: [embeddings]
      summary: Sémantické vyhľadávanie (top_k)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: top_k, in: query, schema: { type: integer, default: 5 } }
      responses:
        "200":
          description: Výsledky
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  results: { type: array, items: { $ref: "#/components/schemas/EmbedSearchResult" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/email/status:
    get:
      tags: [email]
      summary: Stav Gmail/OAuth integrácie
      responses:
        "200":
          description: configured + mode (sandbox|live)
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  mode: { type: string, example: sandbox }

  /api/email/auth-url:
    get:
      tags: [email]
      summary: URL na OAuth súhlas (Google)
      responses:
        "200":
          description: Consent URL
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string } } }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/email/callback:
    get:
      tags: [email]
      summary: OAuth callback (vymena kodu za tokeny)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, tokeny uložené }

  /api/email/send:
    post:
      tags: [email]
      summary: Odoslanie emailu cez Gmail connector
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendEmailRequest" }
      responses:
        "200":
          description: Odoslané (v sandboxu simulované)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string }
                  mode: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/sequences:
    get:
      tags: [sequences]
      summary: Zoznam sekvencií
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sekvencie
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SequenceOut" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sequences]
      summary: Vytvorenie sekvencie (kroky)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SequenceCreate" }
      responses:
        "201":
          description: Sekvencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SequenceOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/sequences/{sid}:
    get:
      tags: [sequences]
      summary: Detail sekvencie
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sid, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Sekvencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SequenceOut" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sequences/{sid}/enroll:
    post:
      tags: [sequences]
      summary: Zapísanie leadov do sekvencie
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sid, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "200":
          description: Počet zapísaných
          content:
            application/json:
              schema: { type: object, properties: { enrolled: { type: integer } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sequences/{sid}/run:
    post:
      tags: [sequences]
      summary: Spustenie splatných krokov (odoslanie emailov)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sid, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Spracované / odoslané
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed: { type: integer }
                  sent: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/export/leads.csv:
    get:
      tags: [export]
      summary: Export leadov do CSV
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: CSV súbor
          content:
            text/csv: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/export/google-sheets:
    post:
      tags: [export]
      summary: Export do Google Sheets (OAuth, sandbox fallback)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetsExportRequest" }
      responses:
        "200":
          description: Výsledok (v sandboxu simulované)
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string }, appended: { type: integer }, mode: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/export/google-docs:
    post:
      tags: [export]
      summary: Export do Google Docs (OAuth, sandbox fallback)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocsExportRequest" }
      responses:
        "200":
          description: Výsledok (v sandboxe simulované)
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string }, documentId: { type: string }, mode: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workflows:
    get:
      tags: [workflows]
      summary: Zoznam workflowov
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Workflowy
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WorkflowOut" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [workflows]
      summary: Vytvorenie workflow (JSON definícia krokov)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowCreate" }
      responses:
        "201":
          description: Workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workflows/{wid}:
    get:
      tags: [workflows]
      summary: Detail workflowu
      security: [{ bearerAuth: [] }]
      parameters: [{ name: wid, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowOut" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflows/execute:
    post:
      tags: [workflows]
      summary: Spustenie workflow pre lead (score/send_email/enrich/condition)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecuteRequest" }
      responses:
        "200":
          description: Výsledky krokov
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/email/deliverability:
    post:
      tags: [email]
      summary: Kontrola SPF/DKIM/DMARC pre doménu
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverabilityRequest" }
      responses:
        "200":
          description: Výsledok kontroly
          content:
            application/json:
              schema:
                type: object
                properties:
                  spf: { type: boolean }
                  dmarc: { type: boolean }
                  dkim_found: { type: boolean }
                  score: { type: integer }
                  issues: { type: array, items: { type: string } }
                  mode: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/transcription/transcribe:
    post:
      tags: [transcription]
      summary: Transkripcia audia (whisper.cpp, sandbox fallback)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Prepis
          content:
            application/json:
              schema: { type: object, properties: { text: { type: string }, mode: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/transcription/insights:
    post:
      tags: [transcription]
      summary: Zhrnutie hovoru cez LLM (call insights)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InsightsRequest" }
      responses:
        "200":
          description: Zhrnutie
          content:
            application/json:
              schema: { type: object, properties: { summary: { type: string }, mode: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
